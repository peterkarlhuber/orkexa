name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy --strict src
      - run: mypy --strict examples
      # MUP-ONA B0: the import contracts in pyproject.toml ([tool.importlinter]).
      - run: lint-imports
      # Offline only: no API keys are configured, and live tests run only with -m live.
      # MUP-ONA B1: the conformance reports (tests/conformance) are saved per target and compared with the
      # skips this job expects (tests/conformance/expected_skips.json).
      - run: pytest --cov=orkexa --cov-report=term-missing --cov-report=xml -rs --junitxml=junit-test.xml
        env:
          ORKEXA_CONFORMANCE_JOB: test
          ORKEXA_CONFORMANCE_REPORTS: conformance-reports
      # MUP-ONA A0: the skipped tests must match the expectation file (a new skip fails the job).
      - run: python scripts/check_skips.py junit-test.xml tests/ci/skipped-test.txt
      - if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage.xml
      - if: always() && matrix.python-version == '3.13'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: conformance-reports
          path: conformance-reports

  lowest-versions:
    name: test (lowest supported dependency versions)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      # The lower bounds of pyproject.toml (pydantic 2.9 is the minimum of google-genai 2.0).
      - run: pip install "anthropic==2.0.0" "openai==3.0.0" "google-genai==2.0.0" "boto3==1.43.80" "botocore==1.43.80" "pydantic==2.9.0" "typing-extensions==4.14.0"
      - run: pytest -rs --junitxml=junit-lowest-versions.xml
        env:
          ORKEXA_CONFORMANCE_JOB: lowest-versions
      - run: python scripts/check_skips.py junit-lowest-versions.xml tests/ci/skipped-lowest-versions.txt

  packaging:
    name: build and install (fresh virtual environments)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install build==1.6.1 pytest==9.1.1 twine==7.0.0
      - run: python -m build
      - run: twine check --strict dist/*
      # --noconftest: the suite's root conftest needs the provider SDKs, which this
      # job deliberately does not install (the tests create their own environments).
      - run: pytest -m packaging tests/packaging -v -rs --noconftest --junitxml=junit-packaging.xml
      - run: python scripts/check_skips.py junit-packaging.xml tests/ci/skipped-packaging.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install -e ".[docs]"
      - run: mkdocs build --strict

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      # Every runtime dependency, all provider SDKs and optional extras, and the docs toolchain.
      - run: python -m pip install --upgrade pip
      - run: pip install pip-audit==2.10.1 -e ".[all,pdf,vector,docs]"
      - run: pip-audit --skip-editable --progress-spinner off
