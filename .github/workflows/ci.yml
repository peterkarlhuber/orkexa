name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
  # CI-FAST W0: the nightly (nightly.yml) runs this workflow once a night on master.
  workflow_call:

permissions:
  contents: read

concurrency:
  # CI-FAST AP1: a new push to a pull request cancels the older run of that pull request. Every other run (master
  # push, schedule, dispatch, and the nightly's workflow_call, where github.workflow is "Nightly") gets its own group
  # from github.run_id, so it is never cancelled and never waits behind another run.
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      # TABRION VER-1: Tabrion is not on a package index; the pin file supplies the one Tabrion that the range of
      # the "dev" extra (MIG-ORK-1) accepts. The same install is used in every workflow that installs ".[dev]".
      - run: pip install -r requirements/tabrion.txt -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy --strict src
      - run: mypy --strict examples
      # MUP-ONA B0: the import contracts in pyproject.toml ([tool.importlinter]).
      - run: lint-imports
      # TABRION QA-21 (AC-7, ORK-039): only public Tabrion names, and docs/api-consumers.md lists them.
      - run: python scripts/check_tabrion_api.py --check-export docs/api-consumers.md
      # Offline only: no API keys are configured, and live tests run only with -m live.
      # MUP-ONA B1: the conformance reports (tests/conformance) are saved per target and compared with the
      # skips this job expects (tests/conformance/expected_skips.json).
      # MUP-ONA B5: the tests that need a PostgreSQL server (marker "postgres") run in pg-a and pg-b.
      - run: >-
          pytest -m "not postgres" --cov=orkexa --cov-report=term-missing --cov-report=xml -rs
          --junitxml=junit-test.xml
        env:
          ORKEXA_CONFORMANCE_JOB: test
          ORKEXA_CONFORMANCE_REPORTS: conformance-reports
      # MUP-ONA A0: the skipped tests must match the expectation file (a new skip fails the job).
      - run: python scripts/check_skips.py junit-test.xml tests/ci/skipped-test.txt
      - if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage.xml
      - if: always() && matrix.python-version == '3.13'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: conformance-reports
          path: conformance-reports

  lowest-versions:
    name: test (lowest supported dependency versions)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements/tabrion.txt -e ".[dev]"
      # The lower bounds of pyproject.toml (pydantic 2.9 is the minimum of google-genai 2.0; pglast 7.20 is the
      # oldest 7.x release on PyPI; psycopg 3.2.0 is the lower bound of the extra "postgres"; its
      # "binary" extra names a dev build, so psycopg-binary is pinned by name).
      - run: pip install "anthropic==2.0.0" "openai==3.0.0" "google-genai==2.0.0" "boto3==1.43.80" "botocore==1.43.80" "pydantic==2.9.0" "typing-extensions==4.14.0" "pglast==7.20" "psycopg==3.2.0" "psycopg-binary==3.2.0"
      - run: pytest -m "not postgres" -rs --junitxml=junit-lowest-versions.xml
        env:
          ORKEXA_CONFORMANCE_JOB: lowest-versions
      - run: python scripts/check_skips.py junit-lowest-versions.xml tests/ci/skipped-lowest-versions.txt

  # MUP-ONA B5 (T-PKG-1, T-PKG-2): the core without any extra. orkexa and pytest only; the packages import
  # without psycopg and pglast and open no connection, and the core suite passes.
  core-no-extras:
    name: core without extras
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e . "pytest==9.1.1"
      - run: python -c "import importlib.util as u; assert u.find_spec('psycopg') is None and u.find_spec('pglast') is None"
      - run: pytest tests/packaging/test_core_without_extras.py -v -rs --noconftest -p no:cacheprovider

  # TABRION VER-1 (plan doc 06 section 6.4): Tabrion is not on a package index, so every install of ".[dev]" adds
  # -r requirements/tabrion.txt (one direct-URL pin on a final Tabrion commit). pip 25.0 is the oldest pip that
  # installs that file (older pips refuse it); "latest" is the current pip. Each installs the editable checkout with
  # ".[dev]" and, in a second virtual environment, the plain package the way a standalone user does, then checks that
  # the dependencies are consistent and that exactly the pinned Tabrion is installed
  # (tests/architecture/test_tabrion_requirements.py::test_the_installed_tabrion_is_the_pin, which every suite run
  # checks too; it detects an accidental index install, it is no proof of origin). DC-OR-1 (dependency confusion),
  # leg "poisoned index", reported by ci-ok: both installs run under scripts/check_tabrion_source.py (a checksummed
  # copy from nodestro-studio), which replaces the index with a poisoned one serving tabrion 0.1.0 (a wheel with a
  # forged direct_url.json and an sdist, both run code) and redirecting every other name to PyPI. It fails when pip
  # asks that index for tabrion at all (the proof), when the install never used the index or an index option would
  # bypass it, when poisoned code ran, or when tabrion's direct_url.json is not the pin's. Its positive control first
  # shows that a plain "pip install tabrion" would take the poisoned one.
  tabrion-install:
    name: tabrion install (pip ${{ matrix.pip }}${{ matrix.index == 'poisoned' && ', poisoned index' || '' }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        pip: ["25.0", "latest"]
        index: ["pypi"]
        include:
          - pip: latest
            index: poisoned
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install with pip ${{ matrix.pip }}
        env:
          PIP_VERSION: ${{ matrix.pip }}
          POISONED: ${{ matrix.index == 'poisoned' && '1' || '' }}
        run: |
          set -euo pipefail
          if [ "$PIP_VERSION" = latest ]; then spec="pip"; else spec="pip==$PIP_VERSION"; fi
          for venv in "$RUNNER_TEMP/dev" "$RUNNER_TEMP/plain"; do
            python -m venv "$venv"
            "$venv/bin/python" -m pip install --upgrade "$spec"
            "$venv/bin/python" -m pip --version
          done
          install() {  # install VENV ARGS...: plain, or under the poisoned index (no pip cache: every request is seen)
            local venv=$1; shift
            if [ -n "$POISONED" ]; then
              python -I scripts/check_tabrion_source.py --lock requirements/tabrion.txt --python "$venv/bin/python" -- \
                "$venv/bin/python" -m pip install --no-cache-dir "$@"
            else
              "$venv/bin/python" -m pip install "$@"
            fi
          }
          install "$RUNNER_TEMP/dev" -r requirements/tabrion.txt -e ".[dev]"
          install "$RUNNER_TEMP/plain" -r requirements/tabrion.txt .
      - name: Exactly the pinned Tabrion is installed
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/plain/bin/python" -m pip install pytest==9.1.1
          for venv in "$RUNNER_TEMP/dev" "$RUNNER_TEMP/plain"; do
            "$venv/bin/python" -m pip check
            "$venv/bin/python" -m pytest tests/architecture/test_tabrion_requirements.py -q -p no:cacheprovider --noconftest
          done

  # MUP-ONA B5 (T-CONF-* (PG), T-PART-*, T-DDL-*, T-SCH-*, T-PG-*): the PostgreSQL backend against a real server.
  # pg-a: postgres:17 without pgvector (vectors ranked in Python, mode A); pg-b: pgvector/pgvector:pg17 (mode B),
  # where a test that needs pgvector fails instead of skipping. Both images by digest. Each job runs the suite
  # twice: as the superuser that sets the server up, and as the restricted runtime role (no superuser, owns
  # nothing, no CREATE, only SELECT/INSERT/UPDATE/DELETE on the tables).
  postgres:
    name: ${{ matrix.job }} (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        job: [pg-a, pg-b]
        python: ["3.11", "3.14"]
        include:
          - job: pg-a
            image: postgres@sha256:748a18a54d3842d43bc156f0840d78029b8d349e0feca98c12b9c4ce3404a6b3 # postgres:17
            pgvector: "0"
          - job: pg-b
            image: pgvector/pgvector@sha256:7d0a41464797aeb9862dfdc0bbf1526b82cfd324cdd8036df19e3545f4a9ccb8 # pgvector/pgvector:pg17
            pgvector: "1"
    services:
      postgres:
        image: ${{ matrix.image }}
        env:
          POSTGRES_PASSWORD: orkexa-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      ORKEXA_TEST_POSTGRES: host=127.0.0.1 port=5432 user=postgres password=orkexa-ci dbname=postgres
      ORKEXA_REQUIRE_POSTGRES: "1"
      ORKEXA_REQUIRE_PGVECTOR: ${{ matrix.pgvector }}
      ORKEXA_CONFORMANCE_JOB: ${{ matrix.job }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -r requirements/tabrion.txt -e ".[dev]"
      - name: PostgreSQL tests (superuser)
        run: >-
          pytest -rs --junitxml=junit-${{ matrix.job }}.xml
          tests/backends/postgres tests/conformance/test_postgres_conformance.py
        env:
          ORKEXA_CONFORMANCE_REPORTS: reports/conformance
          ORKEXA_CATALOG_REPORTS: reports/catalog
          ORKEXA_SCHEMA_REPORTS: reports/schema
      - run: python scripts/check_skips.py junit-${{ matrix.job }}.xml tests/ci/skipped-${{ matrix.job }}.txt
      - name: PostgreSQL tests (restricted runtime role)
        run: >-
          pytest -rs --junitxml=junit-${{ matrix.job }}-runtime-role.xml
          tests/backends/postgres tests/conformance/test_postgres_conformance.py
        env:
          ORKEXA_TEST_RUNTIME_ROLE: "1"
      - run: >-
          python scripts/check_skips.py junit-${{ matrix.job }}-runtime-role.xml
          tests/ci/skipped-${{ matrix.job }}-runtime-role.txt
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.job }}-reports-${{ matrix.python }}
          path: reports/
          if-no-files-found: ignore

  packaging:
    name: build and install (fresh virtual environments)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install build==1.6.1 pytest==9.1.1 twine==7.0.0
      - run: python -m build
      - run: twine check --strict dist/*
      # --noconftest: the suite's root conftest needs the provider SDKs, which this
      # job deliberately does not install (the tests create their own environments).
      - run: pytest -m packaging tests/packaging -v -rs --noconftest --junitxml=junit-packaging.xml
      - run: python scripts/check_skips.py junit-packaging.xml tests/ci/skipped-packaging.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[docs]"
      - run: mkdocs build --strict

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      # Every runtime dependency, all provider SDKs and optional extras, and the docs toolchain.
      - run: python -m pip install --upgrade pip
      - run: pip install pip-audit==2.10.1 -e ".[all,pdf,vector,sqlcheck,postgres,docs]"
      - run: pip-audit --skip-editable --progress-spinner off
