name: Platforms

# ORK-013: the offline suite on macOS (arm64, x86-64) and Windows (x64, ARM64) as well as Linux.
# ORK-006: DockerSandbox against a real daemon and the image built from docker/sandbox.Dockerfile.
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
  # CI-FAST W0: the nightly (nightly.yml) runs this workflow once a night on master.
  workflow_call:

permissions:
  contents: read

concurrency:
  # CI-FAST AP1: a new push to a pull request cancels the older run of that pull request. Every other run (master
  # push, schedule, dispatch, and the nightly's workflow_call, where github.workflow is "Nightly") gets its own group
  # from github.run_id, so it is never cancelled and never waits behind another run.
  group: platforms-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  offline:
    name: offline suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel, windows-latest, windows-11-arm]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: |
          # Windows ARM64: cryptography (google-auth) has win_arm64 wheels only up to 46.0.3, and sqlite-vec
          # has none (its retrieval tests skip without it); the other dev tools are installed one by one.
          # --prefer-binary (both branches): a release that is on PyPI as an sdist only (pglast 8.8, 2026-11-13) must
          # not force a source build, which fails on the Windows runners (x64 and ARM64); pip takes the newest
          # release with a wheel for the platform instead.
          if [ "$RUNNER_OS" = "Windows" ] && [ "$RUNNER_ARCH" = "ARM64" ]; then
            echo "cryptography==46.0.3" > "$RUNNER_TEMP/constraints.txt"
            export PIP_CONSTRAINT="$RUNNER_TEMP/constraints.txt"
            pip install --prefer-binary -e . "anthropic>=2.0,<3" "openai>=3.0,<4" "google-genai>=2.0,<3" "boto3>=1.43.80,<2" \
              "pypdf>=6.21.4" "pytest>=8" "pytest-cov>=5" "mypy>=1.13" "pglast>=7,<9"
          else
            pip install --prefer-binary -e ".[dev]"
          fi
      - name: System
        run: python -c "import platform, sys; print(sys.platform, platform.machine(), platform.platform())"
      - run: pytest -v -s tests/test_sandbox_lifecycle.py
      # MUP-ONA B5: no PostgreSQL server here (the "postgres" tests run in ci.yml pg-a and pg-b). Windows ARM64
      # installs no psycopg (no psycopg-binary wheel): the tests that render SQL with it skip there.
      - run: pytest -m "not postgres" -q -rs --junitxml=junit-offline.xml
        env:
          ORKEXA_CONFORMANCE_JOB: offline
      # MUP-ONA A0: the skipped tests of this platform must match its expectation file.
      - run: python scripts/check_skips.py junit-offline.xml "tests/ci/skipped-offline-${{ matrix.os }}.txt"
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-offline-${{ matrix.os }}
          path: junit-offline.xml

  docker:
    # ORK-006/019/020/021: DockerSandbox against real daemons. Each job builds docker/sandbox.Dockerfile, runs the
    # preflight and the self-test (python -m orkexa.dynamic.docker --self-test) and the real-container tests,
    # which fail instead of skipping under ORKEXA_REQUIRE_DOCKER=1. The "refused" job proves that a rootless daemon
    # without cpu cgroup delegation is refused. Apple Silicon (no nested virtualization) and Windows (no Linux
    # containers on the hosted runners) cannot run here: docs/development/docker-manual-verification.md.
    name: DockerSandbox (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: rootful, os: ubuntu-24.04, mode: rootful, experimental: false }
          - { name: rootless, os: ubuntu-24.04, mode: rootless, experimental: false }
          - { name: rootless without cpu delegation is refused, os: ubuntu-24.04, mode: refused, experimental: false }
          - { name: podman, os: ubuntu-24.04, mode: podman, experimental: false }
          # Rootless Podman 4.9.3 (Ubuntu 24.04) does not apply the --ulimit limits and runs crun unconfined by
          # AppArmor: the self-test must refuse it (its mount table passes; it is printed below).
          - { name: podman rootless is refused, os: ubuntu-24.04, mode: podman-rootless, experimental: true }
          - { name: rootful arm64, os: ubuntu-24.04-arm, mode: rootful, experimental: false }
          - { name: colima macOS x86-64, os: macos-15-intel, mode: colima, experimental: true }
    env:
      ORKEXA_REQUIRE_DOCKER: ${{ matrix.mode == 'refused' && '0' || '1' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e ".[dev]"

      - name: Delegate cgroup controllers to the runner user
        if: matrix.mode == 'rootless' || matrix.mode == 'refused' || matrix.mode == 'podman-rootless'
        run: |
          set -euo pipefail
          # rootless: cpu, memory and pids for the user's containers; refused: no cpu (systemd delegates pids to
          # every user manager anyway), so the daemon cannot enforce --cpus and the preflight must refuse it.
          if [ "${{ matrix.mode }}" = refused ]; then controllers="memory pids"; else controllers="cpu cpuset io memory pids"; fi
          sudo mkdir -p /etc/systemd/system/user@.service.d
          printf '[Service]\nDelegate=\nDelegate=%s\n' "$controllers" | sudo tee /etc/systemd/system/user@.service.d/delegate.conf
          sudo systemctl daemon-reload
          # Ubuntu 24.04 restricts unprivileged user namespaces with AppArmor; rootlesskit needs them.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo apt-get update -q
          sudo apt-get install -y -q uidmap dbus-user-session
          if [ "${{ matrix.mode }}" != podman-rootless ]; then
            sudo apt-get install -y -q docker-ce-rootless-extras || {
              curl -fsSL https://get.docker.com/rootless | FORCE_ROOTLESS_INSTALL=1 SKIP_IPTABLES=1 sh
              echo "$HOME/bin" >> "$GITHUB_PATH"
            }
          fi
          sudo loginctl enable-linger "$(id -un)"
          sudo systemctl restart "user@$(id -u).service"
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u)/bus" >> "$GITHUB_ENV"
          delegated="$(cat "/sys/fs/cgroup/user.slice/user-$(id -u).slice/user@$(id -u).service/cgroup.controllers")"
          echo "delegated controllers: $delegated"
          if [ "${{ matrix.mode }}" = refused ]; then
            case " $delegated " in *" cpu "*) echo "cpu is still delegated"; exit 1;; esac
          else
            for c in cpu memory pids; do case " $delegated " in *" $c "*) ;; *) echo "$c is not delegated"; exit 1;; esac; done
          fi
      - name: Start rootless Docker
        if: matrix.mode == 'rootless' || matrix.mode == 'refused'
        run: |
          set -euo pipefail
          export PATH="$HOME/bin:$PATH"
          dockerd-rootless-setuptool.sh install --force --skip-iptables
          echo "DOCKER_HOST=unix://$XDG_RUNTIME_DIR/docker.sock" >> "$GITHUB_ENV"
      - name: Start Podman's Docker API
        if: matrix.mode == 'podman'
        run: |
          set -euo pipefail
          podman --version
          sudo sh -c 'nohup podman system service --time=0 unix:///run/podman-ci.sock > /tmp/podman-service.log 2>&1 &'
          for _ in $(seq 30); do [ -S /run/podman-ci.sock ] && break; sleep 1; done
          sudo chmod 666 /run/podman-ci.sock
          echo "DOCKER_HOST=unix:///run/podman-ci.sock" >> "$GITHUB_ENV"
      - name: Start rootless Podman's Docker API
        if: matrix.mode == 'podman-rootless'
        run: |
          set -euo pipefail
          podman --version
          podman info --format '{{.Host.Security.Rootless}} {{.Host.CgroupsVersion}} {{.Host.OCIRuntime.Name}}'
          nohup podman system service --time=0 "unix://$XDG_RUNTIME_DIR/podman-ci.sock" > /tmp/podman-service.log 2>&1 &
          for _ in $(seq 30); do [ -S "$XDG_RUNTIME_DIR/podman-ci.sock" ] && break; sleep 1; done
          echo "DOCKER_HOST=unix://$XDG_RUNTIME_DIR/podman-ci.sock" >> "$GITHUB_ENV"
      - name: Start Colima
        if: matrix.mode == 'colima'
        run: |
          set -euo pipefail
          brew install colima docker
          colima start --vm-type vz --cpu 2 --memory 4 || colima start --vm-type qemu --cpu 2 --memory 4
          echo "DOCKER_HOST=unix://$HOME/.colima/default/docker.sock" >> "$GITHUB_ENV"

      - name: Daemon
        run: |
          docker version
          docker info
          python -m orkexa.dynamic.docker --preflight --json || true
      - name: Build the sandbox image
        if: matrix.mode != 'refused'
        run: |
          if [ "${{ matrix.mode }}" = podman ]; then
            sudo podman build -t orkexa-sandbox -f docker/sandbox.Dockerfile .
          elif [ "${{ matrix.mode }}" = podman-rootless ]; then
            podman build -t orkexa-sandbox -f docker/sandbox.Dockerfile .
          else
            docker build -t orkexa-sandbox -f docker/sandbox.Dockerfile .
          fi
      - name: Self-test
        if: matrix.mode != 'refused' && matrix.mode != 'podman-rootless'
        run: python -m orkexa.dynamic.docker --self-test --json
      - name: Rootless Podman is refused (rlimits, AppArmor)
        if: matrix.mode == 'podman-rootless'
        run: |
          set -euo pipefail
          if python -m orkexa.dynamic.docker --self-test --json | tee /tmp/self-test.json; then
            echo "the self-test must refuse rootless Podman while it does not apply the limits"; exit 1
          fi
          grep -q '"reason": "self-test"' /tmp/self-test.json
      - name: Mount table of a sandbox container (evidence for the allow list)
        if: always() && (matrix.mode == 'podman' || matrix.mode == 'podman-rootless')
        run: |
          # The mount table a container of run_args()' shape gets on this engine, and what check_mount_table()
          # says about it: compare with tests/fixtures/docker/mountinfo/podman-*.txt.
          python - <<'PY'
          import subprocess
          from orkexa.dynamic.docker import ContainerLimits, run_args
          from orkexa.dynamic.docker._self_test import check_mount_table
          args = run_args("docker", "orkexa-sandbox-mountinfo", "orkexa-sandbox", ContainerLimits(256, 1.0, 64))
          text = subprocess.run([*args, "cat", "/proc/self/mountinfo"], stdin=subprocess.DEVNULL,
                                capture_output=True, text=True, timeout=120, check=True).stdout
          print(text)
          print("check_mount_table:", check_mount_table(text) or "no problems")
          PY
      - name: Real-container tests
        if: matrix.mode != 'refused' && matrix.mode != 'podman-rootless'
        run: pytest -v -rs -m docker tests/test_docker_sandbox.py tests/anthropic/test_dynamic_sandbox.py
      - name: The daemon without delegation is refused
        if: matrix.mode == 'refused'
        run: |
          set -euo pipefail
          docker pull -q python:3.12-slim && docker tag python:3.12-slim orkexa-sandbox
          python tests/docker_refusal_check.py
          if python -m orkexa.dynamic.docker --self-test; then echo "the self-test must fail here"; exit 1; fi
      - name: No sandbox container is left
        if: always() && matrix.mode != 'refused'
        run: test -z "$(docker ps -a -q --filter label=org.orkexa.sandbox)"
