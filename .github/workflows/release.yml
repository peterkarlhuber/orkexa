# Builds, verifies and publishes the orkexa distribution when a GitHub release is published.
#
# Nothing here runs on pushes or pull requests. Publishing needs one-time manual setup
# (see docs/development/releasing.md): a PyPI trusted publisher for the project and a
# protected GitHub environment named "pypi". Until then the publish job fails without
# uploading anything.
name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  nightly-gate:
    # CI-FAST release lock: no build and no publication unless the latest completed nightly (nightly.yml on master)
    # of this repository passed and is less than 36 hours old.
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: The latest nightly of this repository passed within 36 hours
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          status=0
          for repo in "$GITHUB_REPOSITORY"; do
            if ! gh api "repos/$repo/actions/workflows/nightly.yml/runs?branch=master&status=completed&per_page=1" > nightly.json; then
              echo "::error::$repo: cannot read the runs of nightly.yml"; status=1; continue
            fi
            python3 -I - "$repo" nightly.json <<'PY' || status=1
          import datetime, json, sys
          repo, path = sys.argv[1], sys.argv[2]
          runs = json.load(open(path)).get("workflow_runs") or []
          if not runs:
              sys.exit(f"::error::{repo}: no completed nightly.yml run on master")
          run = runs[0]
          started = datetime.datetime.fromisoformat(run["created_at"].replace("Z", "+00:00"))
          age = datetime.datetime.now(datetime.timezone.utc) - started
          print(f"{repo}: nightly {run['html_url']} {run['conclusion']}, started {run['created_at']} ({age} ago)")
          if run["conclusion"] != "success":
              sys.exit(f"::error::{repo}: the latest nightly did not pass ({run['conclusion']}): {run['html_url']}")
          if age >= datetime.timedelta(hours=36):
              sys.exit(f"::error::{repo}: the latest nightly is older than 36 hours: {run['html_url']}")
          PY
          done
          exit "$status"

  build:
    needs: nightly-gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # build provenance attestations
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Check that the tag matches the package version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          test "$TAG" = "v$version" || { echo "tag $TAG does not match version $version"; exit 1; }
      - run: pip install build==1.6.1 pytest==9.1.1 twine==7.0.0
      # Built-in prices, the Bedrock capability table and the sandbox base image must have been
      # reviewed within 90 days (docs/development/releasing.md, "Upkeep").
      - name: Check that the dated snapshots are fresh
        env:
          ORKEXA_CHECK_FRESHNESS: "1"
        run: |
          pip install -e .
          pytest tests/test_upkeep.py -v --noconftest
      - run: python -m build --outdir dist/orkexa
      - run: twine check --strict dist/orkexa/*
      - run: pytest -m packaging tests/packaging -v --noconftest
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*/*"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
    permissions:
      id-token: write # PyPI trusted publishing (OIDC); no API token is stored
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/orkexa/
