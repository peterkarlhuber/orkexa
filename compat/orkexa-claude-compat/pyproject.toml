[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "orkexa-claude-compat"
version = "0.1.0"
description = "Unchanged `import claude_agent` for code written for claude-agent 0.8.0, served by Orkexa."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Peter Karlhuber" }]
dependencies = ["orkexa[anthropic]==0.1.0"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/peterkarlhuber/orkexa"

[tool.hatch.build.targets.wheel]
packages = ["src/claude_agent"]
