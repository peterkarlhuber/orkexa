site_name: Orkexa
site_description: One agent runtime for Anthropic Claude, OpenAI, Google Gemini and OpenAI-compatible endpoints.
repo_url: https://github.com/peterkarlhuber/orkexa
repo_name: peterkarlhuber/orkexa
copyright: Copyright &copy; 2026 Peter Karlhuber – MIT License

theme:
  name: material
  logo: assets/branding/orkexa-mark.png
  favicon: assets/branding/favicon-32.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow

extra_css:
  - assets/stylesheets/orkexa.css

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            merge_init_into_class: true
            members_order: source
            filters: ["!^_"]
            heading_level: 2

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true

nav:
  - Home: index.md
  - Getting started:
      - Installation: getting-started/installation.md
      - Quickstart: getting-started/quickstart.md
      - Providers and capabilities: getting-started/providers.md
  - Guides:
      - Tools and structured output: guides/tools-and-structured-output.md
      - Streaming, hooks and errors: guides/streaming-hooks-errors.md
      - History and provider switching: guides/history.md
      - Memory, files and RAG: guides/memory-files-rag.md
      - Usage, pricing and budgets: guides/usage-and-budgets.md
      - Pricing engine: guides/pricing.md
      - Multi-agent and dynamic agents: guides/multi-agent.md
      - Flows, loops and approvals: guides/flows.md
      - Orchestration: guides/orchestration.md
      - Security: guides/security.md
  - Data protection and AI regulation:
      - compliance/index.md
      - Data flows and retention: compliance/data-flows.md
      - GDPR: compliance/gdpr.md
      - EU AI Act: compliance/eu-ai-act.md
      - ISO/IEC 42001: compliance/iso-iec-42001.md
  - Troubleshooting and FAQ: troubleshooting.md
  - Feature matrix: feature-matrix.md
  - Examples: examples.md
  - API reference:
      - Agents: reference/agents.md
      - Providers: reference/providers.md
      - Types and events: reference/types.md
      - Tools and content: reference/tools.md
      - Memory, files, retrieval: reference/storage.md
      - Evaluation: reference/evaluation.md
      - Dynamic agents: reference/dynamic.md
      - Flows: reference/flow.md
      - Orchestration: reference/orchestration.md
      - Usage: reference/usage.md
      - Pricing: reference/pricing.md
      - Errors: reference/errors.md
  - Architecture:
      - Target architecture: architecture/target-architecture.md
      - ADR 0001 single runtime: architecture/decisions/0001-single-runtime.md
      - ADR 0002 neutral history: architecture/decisions/0002-neutral-history.md
      - ADR 0003 capabilities: architecture/decisions/0003-capabilities.md
      - ADR 0005 module layout: architecture/decisions/0005-module-layout.md
      - ADR 0006 provider APIs: architecture/decisions/0006-provider-apis.md
      - ADR 0007 credentials and endpoints: architecture/decisions/0007-credentials-and-endpoints.md
      - ADR 0008 pricing engine: architecture/decisions/0008-pricing-engine.md
      - ADR 0009 flow kernel: architecture/decisions/0009-flow-kernel.md
      - ADR 0010 orchestration protocol: architecture/decisions/0010-orchestration-protocol.md
      - ADR 0011 dynamic teams and paused delegations: architecture/decisions/0011-dynamic-teams-and-paused-delegations.md
  - Development:
      - development/index.md
      - Releasing: development/releasing.md
  - Changelog: changelog.md
