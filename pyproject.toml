# QA-16 (AC-1, edge list K-33 of the Tabrion plan): Orkexa never imports Axentra, Nodestro or a Studio. Tabrion is an
# allowed edge for orkexa.backends.postgres (orkexa[postgres] -> tabrion[postgres], MIG-ORK-2); the core below may
# import tabrion only once MIG-ORK-3 is merged (owner decision E-ORK-CORE), which removes the second contract.
# tests/architecture/test_forbidden_probe.py turns each contract red with a forbidden import in a copy of the package.
[[tool.importlinter.contracts]]
name = "Orkexa depends on no Axentra, Nodestro or Studio package (K-33)"
type = "forbidden"
source_modules = ["orkexa"]
forbidden_modules = [
    "axentra",
    "axentra_studio",
    "nodestro",
    "nodestro_runtime",
    "nodestro_api",
    "nodestro_studio",
    "nodestro_examples",
    "nodestro_integrations",
    "nodestro_sdk",
    "nodestro_client",
    "tabrion_studio",
]

[[tool.importlinter.contracts]]
name = "Core modules do not import tabrion until MIG-ORK-3 (E-ORK-CORE, K-33)"
type = "forbidden"
as_packages = false
source_modules = [
    "orkexa",
    "orkexa._aio",
    "orkexa._aio.**",
    "orkexa._cancel",
    "orkexa._cancel.**",
    "orkexa._pdf_launch",
