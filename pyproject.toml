    "orkexa.backends",
    "orkexa.backends.sqlite",
    "orkexa.backends.sqlite.**",
    "orkexa.claude",
    "orkexa.claude.**",
    "orkexa.content",
    "orkexa.content.**",
    "orkexa.core",
    "orkexa.core.**",
    "orkexa.dynamic",
