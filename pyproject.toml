[build-system]
requires = ["hatchling>=1.27", "hatch-fancy-pypi-readme>=24.1"]
build-backend = "hatchling.build"

[project]
name = "orkexa"
version = "0.1.0"
description = "Provider-independent Python agents and multi-agent systems: one runtime for Anthropic Claude, OpenAI, Google Gemini and OpenAI-compatible endpoints, with strict tools, memory, RAG, evaluation, dynamic agents and cost tracking."
dynamic = ["readme"]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Peter Karlhuber" }]
keywords = ["llm", "agent", "multi-agent", "tool-use", "anthropic", "claude", "openai", "gemini", "ollama", "vllm", "pydantic", "rag", "evaluation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Pydantic :: 2",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.6,<3",
    "typing-extensions>=4.14",
]

[project.optional-dependencies]
anthropic = ["anthropic>=2.0,<3"]
openai = ["openai>=3.0,<4"]
gemini = ["google-genai>=2.0,<3"]
all = ["anthropic>=2.0,<3", "openai>=3.0,<4", "google-genai>=2.0,<3"]
pdf = ["pypdf>=4"]
vector = ["sqlite-vec>=0.1.6"]
docs = [
    "mkdocs>=1.6,<2",  # MkDocs 2 drops the plugin system that Material and mkdocstrings use
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.27",
    # 11.0.1 fixes PYSEC-2026-3609/3654; 12 needs mkdocstrings 1.0.7+, which needs Python 3.11+.
    "mkdocstrings>=1.0.7; python_version >= '3.11'",
    "pymdown-extensions>=11.0.1,<12; python_version < '3.11'",
    "pymdown-extensions>=11.0.1,<13; python_version >= '3.11'",
]
dev = [
    "anthropic>=2.0,<3",
    "openai>=3.0,<4",
    "google-genai>=2.0,<3",
    "build>=1.2",
    "mypy>=1.13",
    "pypdf>=4",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.8",
    "sqlite-vec>=0.1.6",
]

[project.urls]
Repository = "https://github.com/peterkarlhuber/orkexa"
Issues = "https://github.com/peterkarlhuber/orkexa/issues"
Changelog = "https://github.com/peterkarlhuber/orkexa/blob/master/CHANGELOG.md"
Security = "https://github.com/peterkarlhuber/orkexa/blob/master/SECURITY.md"

# PyPI cannot resolve repository-relative paths: the published description points the
# logo and the relative links to stable absolute URLs on the default branch, while
# README.md keeps relative paths for GitHub (tests/packaging checks the result).
[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '<img src="(?!https?:)([^"]+)"'
replacement = '<img src="https://raw.githubusercontent.com/peterkarlhuber/orkexa/master/\1"'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = 'href="(?!https?:|#|mailto:)([^"]+)"'
replacement = 'href="https://github.com/peterkarlhuber/orkexa/blob/master/\1"'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\]\((?!https?:|#|mailto:)([^)\s]+)\)'
replacement = '](https://github.com/peterkarlhuber/orkexa/blob/master/\1)'

[tool.hatch.build.targets.wheel]
packages = ["src/orkexa"]

[tool.hatch.build.targets.sdist]
exclude = ["compat/", ".github/", "assets/", "docs/assets/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "live: calls a real provider API (needs API keys, costs money); run with -m live",
    "packaging: builds wheels and creates fresh virtual environments (slow)",
]

[tool.coverage.run]
source = ["orkexa"]
omit = ["*/dynamic/_sandbox_runner.py"]

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["docs/examples.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["orkexa", "claude_agent"]

[tool.ruff.lint.per-file-ignores]
"tests/legacy/*" = ["RUF", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["orkexa"]
mypy_path = "src"
