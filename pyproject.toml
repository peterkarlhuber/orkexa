    "orkexa._storage.**",
    "orkexa.agent",
    "orkexa.agent.**",
    "orkexa.async_agent",
    "orkexa.async_agent.**",
    "orkexa.backends",
    "orkexa.backends.**",
    "orkexa.claude",
    "orkexa.claude.**",
    "orkexa.content",
    "orkexa.content.**",
    "orkexa.core",
    "orkexa.core.**",
    "orkexa.dynamic",
    "orkexa.dynamic.**",
    "orkexa.embeddings",
    "orkexa.embeddings.**",
    "orkexa.errors",
    "orkexa.errors.**",
    "orkexa.evaluation",
    "orkexa.evaluation.**",
    "orkexa.files",
    "orkexa.files.**",
    "orkexa.flow",
    "orkexa.flow.**",
    "orkexa.local",
    "orkexa.local.**",
    "orkexa.memory",
    "orkexa.memory.**",
    "orkexa.orchestration",
    "orkexa.orchestration.**",
    "orkexa.pricing",
    "orkexa.pricing.**",
    "orkexa.providers",
    "orkexa.providers.**",
    "orkexa.retrieval",
    "orkexa.retrieval.**",
    "orkexa.tools",
    "orkexa.tools.**",
    "orkexa.usage",
    "orkexa.usage.**",
]
forbidden_modules = ["*.testing", "*.testing.**"]  # = orkexa.testing (a literal name must exist)

# MUP-ONA B2: the contract modules never import a storage backend at module level; backends import them. Their only
# edges into orkexa.backends are the re-exports of the SQLite classes (an import under TYPE_CHECKING plus a PEP 562
# __getattr__ that loads the class on first access), ignored below; tests/backends/sqlite/test_import_order.py
# (T-API-2) checks that these edges stay lazy and that every import order works.
[[tool.importlinter.contracts]]
name = "Contract modules do not import orkexa.backends at runtime"
type = "forbidden"
source_modules = ["orkexa.retrieval", "orkexa.files", "orkexa.memory", "orkexa.embeddings"]
forbidden_modules = ["orkexa.backends"]
ignore_imports = [
    "orkexa.retrieval -> orkexa.backends.sqlite.index",
    "orkexa.files -> orkexa.backends.sqlite.files",
    "orkexa.memory -> orkexa.backends.sqlite.memory",
]

# MUP-ONA B5: the SQL rule engine is a leaf of its own. It imports only the standard library and pglast (late), so
# Nodestro and any other host can use it without the rest of Orkexa's dependencies; tests/test_sqlcheck.py checks
# the import of the package root, which import-linter does not report, and of third-party packages.
[[tool.importlinter.contracts]]
name = "orkexa.testing.sqlcheck imports no other orkexa module"
type = "forbidden"
as_packages = false
source_modules = ["orkexa.testing.sqlcheck"]
forbidden_modules = [
    "orkexa._aio",
    "orkexa._aio.**",
    "orkexa._cancel",
    "orkexa._cancel.**",
    "orkexa._pdf_launch",
    "orkexa._pdf_launch.**",
