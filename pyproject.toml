[build-system]
requires = ["hatchling>=1.27", "hatch-fancy-pypi-readme>=24.1"]
build-backend = "hatchling.build"

[project]
name = "orkexa"
version = "0.1.0"
description = "Provider-independent Python agents and multi-agent systems: one runtime for Anthropic Claude, OpenAI, Google Gemini, Amazon Bedrock and OpenAI-compatible endpoints, with strict tools, memory, RAG, evaluation, dynamic agents and cost tracking."
dynamic = ["readme"]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Peter Karlhuber" }]
keywords = ["llm", "agent", "multi-agent", "tool-use", "anthropic", "claude", "openai", "gemini", "bedrock", "aws", "ollama", "vllm", "pydantic", "rag", "evaluation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Pydantic :: 2",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.6,<3",
    "typing-extensions>=4.14",
]

[project.optional-dependencies]
anthropic = ["anthropic>=2.0,<3"]
openai = ["openai>=3.0,<4"]
gemini = ["google-genai>=2.0,<3"]
# 1.43.80 is the first release whose Converse model has outputConfig.effort (structured output,
# strict tools and serviceTier are older); boto3 and botocore share version numbers.
bedrock = ["boto3>=1.43.80,<2"]
all = ["anthropic>=2.0,<3", "openai>=3.0,<4", "google-genai>=2.0,<3", "boto3>=1.43.80,<2"]
# 6.21.4 is the first pypdf without a known advisory (OSV/GitHub, 2026-11-06: the last fixes, e.g.
# GHSA-mfr5-77xh-9j7h, GHSA-cggf-277g-3q54 and GHSA-5849-834g-hvw5, are in 6.21.4; most advisories are
# denial of service by memory or run time, which pdf_pages_isolated also bounds).
pdf = ["pypdf>=6.21.4"]
vector = ["sqlite-vec>=0.1.6"]
# Unpacking the Linux Ollama runtime archive (.tar.zst) for orkexa.local.install_runtime.
local = ["zstandard>=0.23"]
# Building models from upstream weights (orkexa.local.convert), e.g. mDenseOn.
convert = ["gguf>=0.17,<1"]
docs = [
    "mkdocs>=1.6,<2",  # MkDocs 2 drops the plugin system that Material and mkdocstrings use
    "mkdocs-material>=9.5",
    # 1.0.7+ is needed by pymdown-extensions 12.
    "mkdocstrings[python]>=1.0.7",
    # 11.0.1 fixes PYSEC-2026-3609/3654.
    "pymdown-extensions>=11.0.1,<13",
]
dev = [
    "anthropic>=2.0,<3",
    "openai>=3.0,<4",
    "google-genai>=2.0,<3",
    "boto3>=1.43.80,<2",
    "build>=1.2",
    "mypy>=1.13",
    "pypdf>=6.21.4",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.8",
    "sqlite-vec>=0.1.6",
    "zstandard>=0.23",
    "gguf>=0.17,<1",
]

[project.scripts]
orkexa-local = "orkexa.local.__main__:main"

[project.urls]
Repository = "https://github.com/peterkarlhuber/orkexa"
Issues = "https://github.com/peterkarlhuber/orkexa/issues"
Changelog = "https://github.com/peterkarlhuber/orkexa/blob/master/CHANGELOG.md"
Security = "https://github.com/peterkarlhuber/orkexa/blob/master/SECURITY.md"

# PyPI cannot resolve repository-relative paths: the published description points the
# logo and the relative links to stable absolute URLs on the default branch, while
# README.md keeps relative paths for GitHub (tests/packaging checks the result).
[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

# PyPI has no dark mode: drop the README hero's dark-scheme <source>, keep the light <img>.
[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\s*<source media="\(prefers-color-scheme: dark\)"[^>]*>'
replacement = ''

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '<img src="(?!https?:)([^"]+)"'
replacement = '<img src="https://raw.githubusercontent.com/peterkarlhuber/orkexa/master/\1"'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = 'href="(?!https?:|#|mailto:)([^"]+)"'
replacement = 'href="https://github.com/peterkarlhuber/orkexa/blob/master/\1"'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\]\((?!https?:|#|mailto:)([^)\s]+)\)'
replacement = '](https://github.com/peterkarlhuber/orkexa/blob/master/\1)'

[tool.hatch.build.targets.wheel]
packages = ["src/orkexa"]

[tool.hatch.build.targets.sdist]
# The legacy SQLite fixtures (tests/fixtures/legacy) are binary test data for the repository's tests only.
exclude = [".github/", "assets/", "docs/assets/", "tests/fixtures/legacy/**/*.db"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "live: calls a real provider API (needs API keys, costs money); run with -m live",
    "packaging: builds wheels and creates fresh virtual environments (slow)",
    "docker: needs a real Docker or Podman daemon and the orkexa-sandbox image; skipped without one unless ORKEXA_REQUIRE_DOCKER=1",
]

[tool.coverage.run]
source = ["orkexa"]
# The PDF worker and probe run in child processes (tests/test_pdf_limits.py), outside coverage measurement.
omit = ["*/dynamic/_sandbox_runner.py", "*/dynamic/docker/__main__.py", "*/_pdf_worker.py", "*/_pdf_probe.py"]

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["docs/examples.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["orkexa"]

[tool.ruff.lint.per-file-ignores]
# The modules the Docker sandbox runner imports (orkexa.dynamic.docker.RUNNER_MODULES) run with the Python of the
# user's sandbox image, which may be older than Orkexa's own minimum: they stay importable on Python 3.10.
"src/orkexa/{content,errors,tools}.py" = ["UP"]
"src/orkexa/core/{__init__,types}.py" = ["UP"]
"src/orkexa/dynamic/_sandbox_runner.py" = ["UP"]
"tests/anthropic/*" = ["RUF", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["orkexa"]
mypy_path = "src"
